<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuizMate 积分测试版</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="kicker">CloudBase 测试版</p>
          <h1>QuizMate 积分账户</h1>
          <p>邮箱注册登录后，可用支付宝充值积分。模型成功返回一次扣 10 积分；失败、超时不扣分。</p>
        </div>
        <div class="balance-card">
          <span>当前积分</span>
          <strong data-balance>未登录</strong>
        </div>
      </section>

      <section class="panel auth-panel">
        <div class="tabs">
          <button class="active" type="button" data-auth-mode="login">登录</button>
          <button type="button" data-auth-mode="register">注册</button>
        </div>
        <div class="grid two">
          <label>
            邮箱
            <input data-email type="email" autocomplete="email" placeholder="you@example.com" />
          </label>
          <label>
            密码
            <input data-password type="password" autocomplete="current-password" placeholder="至少 8 位" />
          </label>
        </div>
        <div class="row">
          <button type="button" data-submit-auth>登录</button>
          <button class="ghost" type="button" data-refresh-profile>刷新账户</button>
          <button class="ghost" type="button" data-logout>退出</button>
        </div>
        <p class="status" data-auth-status></p>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <p class="kicker">充值套餐</p>
            <h2>选择积分包</h2>
          </div>
          <span data-cost-note>成功调用一次扣 10 积分</span>
        </div>
        <div class="packages" data-packages></div>
        <p class="status" data-pay-status></p>
      </section>

      <section class="panel order-panel" data-order-panel hidden>
        <div>
          <p class="kicker">支付宝扫码</p>
          <h2 data-order-title>等待付款</h2>
          <p data-order-info></p>
        </div>
        <div class="qr-wrap">
          <img data-payment-qr alt="支付宝付款二维码" />
          <a data-pay-link target="_blank" rel="noreferrer">打开付款链接</a>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
