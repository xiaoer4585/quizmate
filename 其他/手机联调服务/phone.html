<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>QuizMate · 手机阅读</title>
<style>
:root{color-scheme:light;--paper:#f8fafc;--ink:#0f172a;--muted:#64748b;--accent:#0891b2;--size:19px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif}header{position:sticky;top:0;background:#f8fafcf5;border-bottom:1px solid #e2e8f0;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;z-index:3;display:flex;align-items:center;gap:12px}header strong{font-size:18px;letter-spacing:-.5px}.brand{color:#0891b2}small,.muted{color:var(--muted)}header small{display:block;font-size:12px;margin-top:3px}.balance{margin-left:auto;font-size:12px}main{max-width:760px;margin:auto;padding:24px 20px 100px}h1{font-size:28px;line-height:1.3;margin:16px 0}p{line-height:1.8}label{display:block;font-size:13px;font-weight:600;margin:20px 0 8px}input{display:block;width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;background:white}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;min-height:44px;background:#e2e8f0;color:var(--ink)}button:disabled{opacity:.45;cursor:wait}.primary{background:var(--ink);color:white;width:100%;margin-top:20px}.links{display:flex;gap:18px;margin-top:20px;font-size:13px}a{color:#087d95}#error{color:#9a3412;background:#ffedd5;padding:12px;border-radius:8px;line-height:1.6}#error:empty{display:none}.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:20px}.toolbar button{padding:8px 10px;background:transparent;border:1px solid #cbd5e1;font-size:13px}.toolbar button.selected{background:#0f172a;color:white;border-color:#0f172a}.spacer{flex:1}.eyebrow{font-size:12px;color:#0891b2;letter-spacing:1px;font-weight:700}.question{font-size:17px;line-height:1.65;font-weight:600;margin:10px 0 22px}.answer{font-size:var(--size);line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.answer code{font-family:Consolas,monospace}article{border-left:3px solid #0891b2;padding:0 0 0 16px;margin-bottom:28px}details{border-top:1px solid #e2e8f0;margin-top:22px;padding-top:16px}summary{font-size:14px;color:#475569;cursor:pointer}details p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}.meta{display:flex;align-items:center;gap:8px;color:#64748b;font-size:12px}.meta button{margin-left:auto;padding:6px 12px;font-size:12px;min-height:36px}.empty{padding:55px 0;border-top:1px solid #e2e8f0}.empty h2{font-size:22px}.history{border-top:1px solid #cbd5e1;padding-top:18px;margin-top:28px}.history button{display:block;background:white;text-align:left;width:100%;margin:8px 0;border:1px solid #e2e8f0}.history small{display:block;margin-bottom:5px}#new{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);box-shadow:0 5px 25px #0f172a33;background:#0891b2;color:white;z-index:4;white-space:nowrap}footer{font-size:12px;color:#64748b;margin-top:32px}body.dark{--paper:#0f172a;--ink:#f1f5f9;--muted:#94a3b8;color-scheme:dark}body.dark header{background:#0f172af5}body.dark input,body.dark .history button{background:#1e293b;color:#f1f5f9}body.dark button{color:#f1f5f9;background:#334155}body.dark .primary{background:#0891b2}[hidden]{display:none!important}
</style></head><body>
<header><strong class="brand">QuizMate</strong><div><strong>手机阅读</strong><small id="status">连接你的电脑</small></div><div class="balance" id="balance"></div></header>
<main><p id="error" role="alert"></p>
<section id="login"><div class="eyebrow">PC + 手机 / 测试版</div><h1>电脑提问，<br>在手机上从容阅读。</h1><p class="muted">登录与电脑相同的账号，查看本次笔试和面试内容。</p>
<form id="loginForm"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" id="loginButton">登录账号</button></form>
<div class="links"><a href="https://www.quizmate.cn/#credits" target="_blank" rel="noreferrer">注册 / 忘记密码</a><a href="https://www.quizmate.cn/recharge.html" target="_blank" rel="noreferrer">充值积分</a></div></section>
<section id="pair" hidden><div class="eyebrow">连接电脑</div><h1>输入电脑连接码</h1><p class="muted">在电脑的「PC+手机笔面试」中生成连接码。连接码 5 分钟内有效。</p><form id="pairForm"><label for="code">6 位连接码</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="off"><button class="primary">连接并开始阅读</button></form></section>
<section id="reader" hidden><div class="toolbar"><button id="all" class="selected">全部</button><button id="exam">笔试</button><button id="interview">面试</button><span class="spacer"></span><button id="font" aria-label="调整字号">大字</button><button id="theme">夜间</button></div>
<div id="content"></div><div class="history"><div class="eyebrow">本次记录</div><div id="history"></div></div></section>
<footer id="accountActions" hidden><button id="disconnect">断开电脑</button> <button id="logout">退出登录</button><p>手机仅接收题目和答案，不采集手机屏幕或声音。请确认当前场景允许使用辅助工具。</p></footer></main><button id="new" hidden>有新答案 · 查看最新</button>
<script>
const el=id=>document.getElementById(id), endpoint=new URL('api',location.href.split('#')[0]).href;
let token=sessionStorage.getItem('relay-account')||'',sessionId=sessionStorage.getItem('relay-session')||'',cards=[],filter='all',selected='',revision=-1,polling=false;
let device=localStorage.getItem('relay-device');if(!device){device='mobile-web-'+crypto.randomUUID();localStorage.setItem('relay-device',device)}
const code=new URLSearchParams(location.hash.slice(1)).get('code');if(code)el('code').value=code;history.replaceState(null,'',location.pathname);
function screen(name){for(const id of ['login','pair','reader'])el(id).hidden=id!==name;el('accountActions').hidden=!token}
async function call(action,fields={}){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,accountToken:token,sessionId,...fields}),signal:AbortSignal.timeout(15000)});const x=await r.json();if(!x.ok){const e=new Error(x.error||'请求失败');e.code=x.code;throw e}return x.data}
function showError(e){el('error').textContent=e.message||'连接失败，请重试'}
el('loginForm').onsubmit=async e=>{e.preventDefault();el('loginButton').disabled=true;try{const d=await call('loginAccount',{email:el('email').value.trim(),password:el('password').value,deviceId:device});token=d.token;sessionStorage.setItem('relay-account',token);el('password').value='';el('error').textContent='';screen('pair')}catch(e){showError(e)}finally{el('loginButton').disabled=false}};
el('pairForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const d=await call('confirmRelayPairing',{code:el('code').value.trim()});sessionId=d.sessionId;sessionStorage.setItem('relay-session',sessionId);el('error').textContent='';screen('reader');await poll()}catch(e){showError(e)}finally{b.disabled=false}};
function node(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function visible(){return cards.filter(c=>filter==='all'||c.kind===filter)}
function render(){const list=visible(),current=list.find(c=>c.id===selected)||list[0];el('content').replaceChildren();el('history').replaceChildren();if(!current){const n=node('div','','empty');n.append(node('h2','已准备好，等待第一道题'),node('p','在电脑按截图快捷键，或开始面试听写。','muted'));el('content').append(n);return}selected=current.id;
const article=node('article'),meta=node('div','','meta');meta.append(node('span',current.kind==='exam'?'笔试':'面试','eyebrow'),node('time',new Date(current.createdAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})));const copy=node('button','复制答案');copy.disabled=current.status!=='done';copy.onclick=async()=>{try{await navigator.clipboard.writeText(current.answer);copy.textContent='已复制'}catch{copy.textContent='请长按文字复制'}};meta.append(copy);article.append(meta,node('div',current.question,'question'));article.append(node('div',current.status==='pending'?'正在生成参考答案…':current.status==='error'?current.error:current.answer,'answer'));if(current.explanation){const details=node('details');details.append(node('summary','展开解析'),node('p',current.explanation));article.append(details)}el('content').append(article);
for(const c of list){const b=node('button');b.append(node('small',(c.kind==='exam'?'笔试':'面试')+' · '+(c.status==='pending'?'生成中':c.status==='error'?'失败':'已完成')),node('span',c.question));b.onclick=()=>{selected=c.id;render();scrollTo({top:0,behavior:'smooth'})};el('history').append(b)}}
async function poll(){if(!token||!sessionId||polling||document.hidden)return;polling=true;try{const d=await call('getRelayEvents');el('status').textContent=d.connected?'电脑已连接':'电脑离线 · 已有答案可继续阅读';el('balance').textContent=String(d.credits??'—')+' 积分';el('error').textContent='';if(d.nextSeq!==revision){const previous=cards.find(c=>c.id===selected);const prevLatest=visible()[0]?.id;cards=d.cards;const current=cards.find(c=>c.id===selected);if(!selected||(selected===prevLatest&&scrollY<80)){selected=visible()[0]?.id||'';render()}else{el('new').hidden=false;if(previous?.status==='pending'&&current?.status!=='pending')render()}revision=d.nextSeq}}catch(e){el('status').textContent='网络中断 · 正在重连';if(['AUTH_REQUIRED','SESSION_EXPIRED'].includes(e.code)){token='';sessionStorage.removeItem('relay-account');screen('login')}if(e.code==='RELAY_EXPIRED'){sessionId='';sessionStorage.removeItem('relay-session');screen('pair')}showError(e)}finally{polling=false}}
for(const id of ['all','exam','interview'])el(id).onclick=()=>{filter=id;selected='';for(const k of ['all','exam','interview'])el(k).classList.toggle('selected',k===id);render()};
el('new').onclick=()=>{selected=visible()[0]?.id||'';render();el('new').hidden=true;scrollTo({top:0,behavior:'smooth'})};
let large=false;el('font').onclick=()=>{large=!large;document.documentElement.style.setProperty('--size',large?'23px':'19px');el('font').textContent=large?'标准字':'大字'};el('theme').onclick=()=>{document.body.classList.toggle('dark');el('theme').textContent=document.body.classList.contains('dark')?'日间':'夜间'};
el('disconnect').onclick=async()=>{try{if(sessionId)await call('revokeRelaySession');sessionId='';cards=[];selected='';revision=-1;sessionStorage.removeItem('relay-session');screen('pair')}catch(e){showError(e)}};
el('logout').onclick=async()=>{try{if(sessionId)await call('revokeRelaySession');await call('logoutAccount')}catch(e){showError(e)}finally{token='';sessionId='';cards=[];selected='';sessionStorage.clear();screen('login')}};
screen(token?(sessionId?'reader':'pair'):'login');render();setInterval(poll,2000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});poll();
</script></body></html>
