<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>QuizMate · 双机协作</title>
<style>
:root{color-scheme:light;--paper:#f8fafc;--ink:#172033;--muted:#64748b;--line:#dbe3ed;--accent:#087f95;--size:20px}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif}header{flex:none;display:flex;align-items:center;gap:12px;min-height:38px;padding:calc(7px + env(safe-area-inset-top)) 14px 7px;border-bottom:1px solid var(--line);font-size:12px}header strong{font-size:16px;color:var(--accent)}#status{color:var(--muted)}#status.connected{color:#059669}#balance{margin-left:auto;white-space:nowrap}main{width:100%;max-width:800px;margin:auto;min-height:0;flex:1;display:flex;flex-direction:column;padding:0 14px;padding-bottom:env(safe-area-inset-bottom)}h1{font-size:27px;line-height:1.4}p{line-height:1.75}.muted{color:var(--muted)}label{display:block;font-size:14px;margin:18px 0 8px}input{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);padding:13px;font-size:16px}button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;min-height:36px;padding:6px 10px;cursor:pointer}button:disabled{opacity:.4;cursor:default}.primary{background:#087f95;color:white;width:100%;margin-top:20px;min-height:44px;border:0}.links{display:flex;gap:20px;margin:20px 0;font-size:13px}a{color:var(--accent)}#login,#pair{overflow-y:auto;padding:16px 6px}#error{margin:6px 0;padding:7px 10px;border-radius:6px;background:#ffedd5;color:#9a3412;font-size:13px;line-height:1.5}#error:empty{display:none}#reader{flex:1;min-height:0;display:flex;flex-direction:column}.toolbar{display:flex;gap:5px;align-items:center;padding:9px 0;flex:none}.toolbar button{font-size:12px;padding:5px 8px}.toolbar .selected{background:#087f95;color:#fff;border-color:#087f95}.spacer{flex:1}#content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;padding:4px 2px 18px;-webkit-overflow-scrolling:touch}.meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}.meta strong{color:var(--accent);font-weight:600}.question{font-size:16px;font-weight:600;line-height:1.65;margin:12px 0 18px;overflow-wrap:anywhere}.answer{font-size:var(--size);line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}details{border-top:1px solid var(--line);padding-top:14px;margin-top:22px}summary{color:var(--muted);font-size:13px;cursor:pointer}details p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:6px 0;flex:none;font-size:12px}.pager button{font-size:12px}#new{background:#087f95;color:white;border:0}body.dark{color-scheme:dark;--paper:#101827;--ink:#edf2f7;--muted:#a6b4c6;--line:#334155;--accent:#67e8f9}
</style></head><body>
<header><strong>QuizMate</strong><span id="status">未连接</span><span id="balance">— 积分</span></header>
<main><p id="error" role="alert"></p>
<section id="login"><h1>双机协作笔面试</h1><p class="muted">登录与电脑相同的账号，连接后查看问题和答案。</p><form id="loginForm"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required><button id="loginButton" class="primary">登录账号</button></form><div class="links"><a href="https://www.quizmate.cn/#credits" target="_blank" rel="noreferrer">注册 / 忘记密码</a><a href="https://www.quizmate.cn/recharge.html" target="_blank" rel="noreferrer">充值积分</a></div></section>
<section id="pair" hidden><h1>连接电脑</h1><p class="muted">输入电脑「双机协作笔面试」中的 6 位连接码。</p><form id="pairForm"><label for="code">连接码</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required><button class="primary">连接并查看答案</button></form></section>
<section id="reader" hidden><div class="toolbar"><button id="all" class="selected">全部</button><button id="exam">笔试</button><button id="interview">面试</button><span class="spacer"></span><button id="font" aria-label="调整字号">大字</button><button id="theme">夜间</button></div><div id="content" tabindex="0" aria-label="题目和答案"></div><div class="pager"><button id="previous">上一题</button><span id="count">0 / 0</span><button id="new" hidden>新答案</button><button id="next">下一题</button></div></section>
</main>
<script>
const el=id=>document.getElementById(id),endpoint=new URL('api',location.href.split('#')[0]).href;
let token='',sessionId='',cards=[],filter='all',claim=new URLSearchParams(location.hash.slice(1)).get('claim')||'',selected='',revision=-1,polling=false,closed=false;
sessionStorage.removeItem('relay-account');sessionStorage.removeItem('relay-session');
let device=localStorage.getItem('relay-device');if(!device){device='mobile-web-'+crypto.randomUUID();localStorage.setItem('relay-device',device)}
const code=new URLSearchParams(location.hash.slice(1)).get('code');if(code)el('code').value=code;history.replaceState(null,'',location.pathname);
if(claim){ token=claim; screen('pair'); el('pairForm').requestSubmit(); }
function screen(name){for(const id of ['login','pair','reader'])el(id).hidden=id!==name}
async function call(action,fields={}){const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,accountToken:token,sessionId,...fields}),signal:AbortSignal.timeout(15000)});const x=await r.json();if(!x.ok){const e=new Error(x.error||'请求失败');e.code=x.code;throw e}return x.data}
function showError(e){el('error').textContent=e.message||'连接失败，请重试'}
function reset(){token='';sessionId='';cards=[];selected='';revision=-1;el('content').replaceChildren();el('balance').textContent='— 积分';el('status').textContent='未连接';el('status').classList.remove('connected');screen(claim?'pair':'login')}
el('loginForm').onsubmit=async e=>{e.preventDefault();el('loginButton').disabled=true;try{const d=await call('loginAccount',{email:el('email').value.trim(),password:el('password').value,deviceId:device});token=d.token;closed=false;el('password').value='';el('error').textContent='';screen('pair')}catch(e){showError(e)}finally{el('loginButton').disabled=false}};
el('pairForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const d=await call('confirmRelayPairing',{code:el('code').value.trim()});sessionId=d.sessionId;el('error').textContent='';screen('reader');render();await poll()}catch(e){showError(e)}finally{b.disabled=false}};
function node(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}
function visible(){return cards.filter(c=>filter==='all'||c.kind===filter)}
function mergeCards(incoming){const byId=new Map(cards.map(c=>[c.id,c]));for(const next of (Array.isArray(incoming)?incoming:[])){const previous=byId.get(next.id);if(!previous||previous.status!=='done'||next.status==='done')byId.set(next.id,next)}return [...byId.values()].sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0))}
function render(){const list=visible(),current=list.find(c=>c.id===selected)||list[0];el('content').replaceChildren();if(!current){el('content').append(node('p','等待电脑发送第一道题…','muted'));selected=''}else{selected=current.id;const article=node('article'),meta=node('div','','meta');meta.append(node('strong',current.kind==='exam'?'笔试':'面试'),node('time',new Date(current.createdAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})));article.append(meta,node('div',current.question,'question'),node('div',current.status==='pending'?'正在生成参考答案…':current.status==='error'?current.error:current.answer,'answer'));if(current.explanation){const d=node('details');d.append(node('summary','展开解析'),node('p',current.explanation));article.append(d)}el('content').append(article)}const i=list.findIndex(c=>c.id===selected);el('count').textContent=list.length?`${list.length-i} / ${list.length}`:'0 / 0';el('previous').disabled=i<0||i>=list.length-1;el('next').disabled=i<=0}
function select(id){selected=id;render();el('content').scrollTop=0;el('new').hidden=true}
async function poll(){if(!token||polling||closed)return;polling=true;try{if(!sessionId){await call('readerHeartbeat');return}const d=await call('getRelayEvents');el('status').textContent=d.connected?'已连接':'未连接';el('status').classList.toggle('connected',d.connected);el('balance').textContent=String(d.credits??'—')+' 积分';el('error').textContent='';if(d.nextSeq!==revision){const prev=cards.find(c=>c.id===selected),oldLatest=visible()[0]?.id,scroll=el('content').scrollTop;cards=mergeCards(d.cards);const current=cards.find(c=>c.id===selected);if(!selected||(selected===oldLatest&&scroll<60)){select(visible()[0]?.id||'')}else{el('new').hidden=false;if(prev?.status==='pending'&&current?.status!=='pending'){render();el('content').scrollTop=scroll}}revision=Math.max(revision,Number(d.nextSeq)||0)}}catch(e){el('status').textContent='未连接';el('status').classList.remove('connected');if(['AUTH_REQUIRED','SESSION_EXPIRED','ACCOUNT_DISABLED','READER_EXPIRED'].includes(e.code))reset();else if(e.code==='RELAY_EXPIRED'){sessionId='';cards=[];selected='';revision=-1;el('content').replaceChildren();screen('pair')}showError(e)}finally{polling=false}}
for(const id of ['all','exam','interview'])el(id).onclick=()=>{filter=id;for(const k of ['all','exam','interview'])el(k).classList.toggle('selected',k===id);select('')};
el('previous').onclick=()=>{const a=visible(),i=a.findIndex(c=>c.id===selected);if(a[i+1])select(a[i+1].id)};el('next').onclick=()=>{const a=visible(),i=a.findIndex(c=>c.id===selected);if(a[i-1])select(a[i-1].id)};el('new').onclick=()=>select(visible()[0]?.id||'');
let large=false;el('font').onclick=()=>{large=!large;document.documentElement.style.setProperty('--size',large?'24px':'20px');el('font').textContent=large?'标准字':'大字'};el('theme').onclick=()=>{document.body.classList.toggle('dark');el('theme').textContent=document.body.classList.contains('dark')?'日间':'夜间'};
function leave(){if(!token||closed)return;closed=true;reset()}
// 页面短暂进入后台、锁屏或被系统回收时不撤销手机会话，避免已同步题目被误清空。
window.addEventListener('pageshow',e=>{if(e.persisted){closed=false;poll()}});document.addEventListener('visibilitychange',()=>{poll()});setInterval(poll,2000);screen('login');
</script></body></html>
