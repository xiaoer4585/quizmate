appId: vip.quizmate.mac
productName: QuizMate
copyright: Copyright (C) 2026 QuizMate
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - resources/**/*
  - package.json
extraResources:
  - from: resources/
    to: resources/
asarUnpack:
  - node_modules/screenshot-desktop
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.png
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: QuizMate needs microphone access for realtime interview transcription.
    NSAudioCaptureUsageDescription: QuizMate needs system audio access to transcribe interviewer questions in realtime.
    NSScreenCaptureUsageDescription: QuizMate needs screen recording access to capture written-test questions.
    NSCameraUsageDescription: QuizMate does not use the camera.
dmg:
  artifactName: QuizMate-Mac-${arch}-${version}.dmg
macUpdate:
  # zip 产物用于 electron-updater 自动更新（Win 用户通过 latest-mac.yml 拉取）；
  # dmg 用于官网手动分发。
  artifactName: QuizMate-Mac-${arch}-${version}-mac.zip
publish:
  provider: generic
  url: https://quizmate.cn/mac/
