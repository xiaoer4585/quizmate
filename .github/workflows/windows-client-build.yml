name: Build QuizMate Windows

# Windows 安装包统一在 GitHub Actions 构建（本地只保留代码）。
# 产物为 ia32 通用包：单个安装包同时兼容 x64 与 32 位(x86) Windows 系统，
# 兼容 Win10 及以上系统（Electron 31 起不支持 Win7/8）。
on:
  workflow_dispatch:
    inputs:
      upload_test_assets:
        description: Upload the 2026-08-26 desktop test installers to OSS only
        required: false
        type: boolean
        default: false
  push:
    branches:
      - windows-build-*
    tags:
      - windows-build-*

permissions:
  contents: write

jobs:
  upload-test-installers:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_test_assets == true }}
    name: Upload test installers to OSS
    runs-on: ubuntu-latest

    steps:
      - name: Download GitHub prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pkg
          gh release download windows-build-20260826-desktop-refactor-6 \
            --repo "${{ github.repository }}" \
            --pattern 'QuizMate-Windows-2026.8.25.exe' \
            --dir pkg
          gh release download mac-build-20260826-desktop-refactor \
            --repo "${{ github.repository }}" \
            --pattern 'QuizMate-Mac-x64-2026.8.24.dmg' \
            --pattern 'QuizMate-Mac-arm64-2026.8.24.dmg' \
            --dir pkg
          sha256sum pkg/*
          test "$(sha256sum pkg/QuizMate-Windows-2026.8.25.exe | awk '{print $1}')" = "9089d7d4693e92b533b50250a3b5eaf6910dce41017eaf922995b74a6e437ce5"
          test "$(sha256sum pkg/QuizMate-Mac-x64-2026.8.24.dmg | awk '{print $1}')" = "6aeb03c54e2ef0161ab6c70d5261648edbc0e36a463ab58d761b4e9c2adba9f4"
          test "$(sha256sum pkg/QuizMate-Mac-arm64-2026.8.24.dmg | awk '{print $1}')" = "94952337adc2345d17821048479e86a8ab3643c0b3147574b2f90e5cf71b7446"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload to OSS test prefix
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null
          npm install ali-oss@6 --no-audit --no-fund
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const OSS = require('ali-oss');
          const client = new OSS({
            region: 'oss-cn-beijing',
            endpoint: 'https://oss-cn-beijing.aliyuncs.com',
            bucket: 'quizmate-cn',
            accessKeyId: process.env.OSS_ACCESS_KEY_ID,
            accessKeySecret: process.env.OSS_ACCESS_KEY_SECRET,
            secure: true,
            timeout: 1_800_000,
          });
          const prefix = 'temp/desktop-test-20260826';
          const files = [
            ['QuizMate-Windows-2026.8.25.exe', 'application/vnd.microsoft.portable-executable'],
            ['QuizMate-Mac-x64-2026.8.24.dmg', 'application/x-apple-diskimage'],
            ['QuizMate-Mac-arm64-2026.8.24.dmg', 'application/x-apple-diskimage'],
          ];
          (async () => {
            for (const [name, contentType] of files) {
              const local = path.join('pkg', name);
              const object = `${prefix}/${name}`;
              const size = fs.statSync(local).size;
              await client.multipartUpload(object, local, {
                parallel: 8,
                partSize: 4 * 1024 * 1024,
                headers: {
                  'Content-Type': contentType,
                  'Content-Disposition': `attachment; filename="${name}"`,
                  'Cache-Control': 'no-cache',
                },
              });
              const head = await client.head(object);
              const remoteSize = Number(head.res.headers['content-length']);
              if (remoteSize !== size) throw new Error(`${object} size mismatch: ${remoteSize} !== ${size}`);
              console.log(`UPLOAD_VERIFY_OK https://quizmate-cn.oss-cn-beijing.aliyuncs.com/${object} size=${size}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify public test URLs
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            QuizMate-Windows-2026.8.25.exe \
            QuizMate-Mac-x64-2026.8.24.dmg \
            QuizMate-Mac-arm64-2026.8.24.dmg
          do
            curl -fsSI "https://quizmate-cn.oss-cn-beijing.aliyuncs.com/temp/desktop-test-20260826/$name" | tee "head-$name.txt"
          done

  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_test_assets != true }}
    name: Windows ia32 universal installer
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows客户端/QuizMate-Windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows客户端/QuizMate-Windows/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Validate source
        shell: bash
        run: |
          set -o pipefail
          {
            npm run typecheck:node
            npm run typecheck:web
          } 2>&1 | tee -a build.log

      - name: Build ia32 installer
        shell: bash
        env:
          # 注入自动更新源域名，与 electron-builder.yml 的 publish.url 占位符配套
          QUIZMATE_UPDATE_BASE_URL: https://quizmate.cn
        run: |
          set -o pipefail
          {
            npm run build
            npx electron-builder --win --ia32 --publish never
          } 2>&1 | tee -a build.log

      - name: Verify installer architecture and artifacts
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          EXE=$(find release -maxdepth 1 -name 'QuizMate-Windows-*.exe' -print -quit)
          BLOCKMAP=$(find release -maxdepth 1 -name 'QuizMate-Windows-*.exe.blockmap' -print -quit)
          APP_UPDATE=release/win-ia32-unpacked/resources/app-update.yml
          test -n "$EXE"
          test -n "$BLOCKMAP"
          test -f release/latest.yml
          test -f "$APP_UPDATE"

          # PE 头校验：安装包与解包后的主程序必须为 32 位 (machine=0x14c)，
          # 保证单个安装包兼容 x64 与 32 位 Windows
          node -e '
            const fs = require("fs");
            for (const p of [process.argv[1], process.argv[2]]) {
              const b = fs.readFileSync(p);
              const off = b.readUInt32LE(0x3c);
              const machine = b.readUInt16LE(off + 4);
              if (machine !== 0x14c) {
                console.error(`FAIL: ${p} PE machine=0x${machine.toString(16)}，期望 0x14c (i386)`);
                process.exit(1);
              }
              console.log(`OK: ${p} -> 32-bit (i386)`);
            }
          ' "$EXE" "release/win-ia32-unpacked/QuizMate.exe"

          grep -q "version: 2026" release/latest.yml
          sha256sum "$EXE" | tee sha256.txt
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "blockmap=$BLOCKMAP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease with installer
        # 用 Release 资产承载产物：不占 Actions 存储配额、不会过期（Actions artifact 配额有限且回收慢）。
        # 这里直接创建 prerelease，方便测试人员从 GitHub 页面下载，不需要访问 draft release。
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            windows-build-*) ;;
            *) TAG="windows-build-manual-${{ github.run_number }}" ;;
          esac
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "QuizMate Windows ia32 ${TAG}" \
              --notes "ia32 通用安装包（单个安装包兼容 x64 与 32 位 Windows，兼容 Win10+）。SHA-256 见 sha256.txt。产物用于本地验证后走 releases/ 目录 + 部署脚本发布。"
          fi
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ steps.artifact.outputs.exe }}" \
            "${{ steps.artifact.outputs.blockmap }}" \
            release/latest.yml \
            sha256.txt \
            build.log
          gh release view "$TAG" --repo "${{ github.repository }}" --json url -q '.url'
