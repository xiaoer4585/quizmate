name: Build QuizMate Windows

# Windows 安装包统一在 GitHub Actions 构建（本地只保留代码）。
# 产物为 ia32 通用包：单个安装包同时兼容 x64 与 32 位(x86) Windows 系统，
# 兼容 Win10 及以上系统（Electron 31 起不支持 Win7/8）。
# 代码在 feature/desktop-unified-core / main 分支上构建：实际执行位于
# windows客户端/QuizMate-Windows，源码已迁入 desktop-core 共享。
on:
  workflow_dispatch:
  push:
    branches:
      - feature/desktop-unified-core
      - main
      - windows-build-*
    tags:
      - windows-build-*
      - windows-delivery-*

permissions:
  contents: write

jobs:
  build:
    name: Windows ia32 universal installer
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows客户端/QuizMate-Windows

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows客户端/QuizMate-Windows/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Verify desktop-core dependency bridge
        # postinstall 会通过 scripts/link-core-modules.cjs 在 desktop-core 下创建
        # 指向本壳 node_modules 的 junction，vite/tsc 才能解析共享层源码的依赖。
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          test -d ../../desktop-core/node_modules/electron \
            || { echo "::error::desktop-core/node_modules bridge missing; link-core-modules.cjs failed"; exit 1; }
          echo "desktop-core dependency bridge OK"

      - name: Validate source
        shell: bash
        run: |
          set -o pipefail
          {
            npm run typecheck:node
            npm run typecheck:web
          } 2>&1 | tee -a build.log

      - name: Build ia32 installer
        shell: bash
        env:
          # 注入自动更新源域名，与 electron-builder.yml 的 publish.url 占位符配套
          # delivery 测试包使用独立空更新通道，不读取正式 suite/latest.yml。
          QUIZMATE_UPDATE_BASE_URL: ${{ startsWith(github.ref, 'refs/tags/windows-delivery-') && format('https://quizmate.cn/temp/{0}', github.ref_name) || 'https://quizmate.cn' }}
        run: |
          set -o pipefail
          {
            npm run build
            npx electron-builder --win --ia32 --publish never
          } 2>&1 | tee -a build.log

      - name: Verify installer architecture and artifacts
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          EXE=$(find release -maxdepth 1 -name 'QuizMate-Windows-*.exe' -print -quit)
          BLOCKMAP=$(find release -maxdepth 1 -name 'QuizMate-Windows-*.exe.blockmap' -print -quit)
          APP_UPDATE=release/win-ia32-unpacked/resources/app-update.yml
          test -n "$EXE"
          test -n "$BLOCKMAP"
          test -f release/latest.yml
          test -f "$APP_UPDATE"

          # PE 头校验：安装包与解包后的主程序必须为 32 位 (machine=0x14c)，
          # 保证单个安装包兼容 x64 与 32 位 Windows
          node -e '
            const fs = require("fs");
            for (const p of [process.argv[1], process.argv[2]]) {
              const b = fs.readFileSync(p);
              const off = b.readUInt32LE(0x3c);
              const machine = b.readUInt16LE(off + 4);
              if (machine !== 0x14c) {
                console.error(`FAIL: ${p} PE machine=0x${machine.toString(16)}，期望 0x14c (i386)`);
                process.exit(1);
              }
              console.log(`OK: ${p} -> 32-bit (i386)`);
            }
          ' "$EXE" "release/win-ia32-unpacked/QuizMate.exe"

          grep -q "version: 2026" release/latest.yml
          sha256sum "$EXE" | tee sha256.txt
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "blockmap=$BLOCKMAP" >> "$GITHUB_OUTPUT"

      - name: Upload isolated delivery package
        if: startsWith(github.ref, 'refs/tags/windows-delivery-')
        shell: bash
        env:
          EXE_PATH: ${{ steps.artifact.outputs.exe }}
          BLOCKMAP_PATH: ${{ steps.artifact.outputs.blockmap }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          TAG_PAYLOAD_B64=$(git cat-file tag "$GITHUB_REF_NAME" | sed '1,/^$/d' | tr -d '\n')
          for key in exe blockmap latest sha256; do
            url=$(TAG_PAYLOAD_B64="$TAG_PAYLOAD_B64" KEY="$key" node -e "const p=JSON.parse(Buffer.from(process.env.TAG_PAYLOAD_B64, 'base64').toString('utf8')); process.stdout.write(p[process.env.KEY] || '')")
            test -n "$url"
            echo "::add-mask::$url"
            case "$key" in
              exe) file="$EXE_PATH"; content_type='application/vnd.microsoft.portable-executable' ;;
              blockmap) file="$BLOCKMAP_PATH"; content_type='application/octet-stream' ;;
              latest) file='release/latest.yml'; content_type='text/yaml; charset=utf-8' ;;
              sha256) file='sha256.txt'; content_type='text/plain; charset=utf-8' ;;
            esac
            curl --fail --silent --show-error --retry 3 \
              -X PUT \
              -H "Content-Type: $content_type" \
              --upload-file "$file" \
              "$url"
          done

      - name: Create GitHub prerelease with installer
        # 用 Release 资产承载产物：不占 Actions 存储配额、不会过期（Actions artifact 配额有限且回收慢）。
        # 这里直接创建 prerelease，方便测试人员从 GitHub 页面下载，不需要访问 draft release。
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            windows-build-*) ;;
            *) TAG="windows-build-manual-${{ github.run_number }}" ;;
          esac
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "QuizMate Windows ia32 ${TAG}" \
              --notes "ia32 通用安装包（单个安装包兼容 x64 与 32 位 Windows，兼容 Win10+）。SHA-256 见 sha256.txt。产物用于本地验证后走 releases/ 目录 + 部署脚本发布。"
          fi
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ steps.artifact.outputs.exe }}" \
            "${{ steps.artifact.outputs.blockmap }}" \
            release/latest.yml \
            sha256.txt \
            build.log
          gh release view "$TAG" --repo "${{ github.repository }}" --json url -q '.url'
