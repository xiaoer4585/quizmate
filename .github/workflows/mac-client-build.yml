name: Build QuizMate Mac

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mac-client
      - mac-build-fix
    tags:
      - mac-build-*
permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.label }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            label: Intel
            expected: x86_64
            uploadKey: intel
            zipUploadKey: intelZip
            logUploadKey: intelLog
          - arch: arm64
            label: Apple-Silicon
            expected: arm64
            uploadKey: apple
            zipUploadKey: appleZip
            logUploadKey: appleLog

    defaults:
      run:
        working-directory: mac客户端/QuizMate-Mac

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mac客户端/QuizMate-Mac/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Validate source
        shell: bash
        run: |
          set -o pipefail
          {
            npm run typecheck:node
            npm run typecheck:web
            # npm audit depends on the registry advisory endpoint. Keep the
            # report, but do not block an otherwise valid package build when
            # that external service is unavailable.
            npm audit --audit-level=high || {
              status=$?
              echo "::warning::npm audit did not complete (exit ${status}); see build.log"
            }
          } 2>&1 | tee -a build.log

      - name: Build DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          {
            npm run build
            npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
          } 2>&1 | tee -a build.log

      - name: Re-sign app for local distribution
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          APP_PATH=$(find release -maxdepth 2 -name 'QuizMate.app' -type d -print -quit)
          test -d "$APP_PATH"
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          rm -f release/QuizMate-Mac-${{ matrix.arch }}-*.dmg
          rm -f release/QuizMate-*-${{ matrix.arch }}-mac.zip
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --prepackaged "$APP_PATH" --publish never

      - name: Verify DMG and executable architecture
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          DMG=$(find release -maxdepth 1 -name "*.dmg" -print -quit)
          ZIP=$(find release -maxdepth 1 -name "*-mac.zip" -print -quit)
          test -n "$DMG"
          test -n "$ZIP"
          hdiutil verify "$DMG"
          MOUNT_DIR=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT_DIR" -nobrowse -readonly
          APP_BIN=$(find "$MOUNT_DIR" -path "*/Contents/MacOS/QuizMate" -type f -print -quit)
          test -n "$APP_BIN"
          APP_PATH=$(find "$MOUNT_DIR" -maxdepth 1 -name 'QuizMate.app' -type d -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee codesign.txt
          file "$APP_BIN" | tee architecture.txt
          grep -q "${{ matrix.expected }}" architecture.txt
          hdiutil detach "$MOUNT_DIR"
          shasum -a 256 "$DMG" | tee sha256.txt
          shasum -a 256 "$ZIP" | tee -a sha256.txt
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: QuizMate-Mac-${{ matrix.label }}-${{ github.run_number }}
          path: |
            mac客户端/QuizMate-Mac/${{ steps.artifact.outputs.dmg }}
            mac客户端/QuizMate-Mac/${{ steps.artifact.outputs.zip }}
            mac客户端/QuizMate-Mac/architecture.txt
            mac客户端/QuizMate-Mac/codesign.txt
            mac客户端/QuizMate-Mac/sha256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Detect Aliyun OSS credentials
        id: oss_credentials
        if: startsWith(github.ref, 'refs/tags/mac-build-')
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID || secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET || secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          if [ -n "${OSS_ACCESS_KEY_ID:-}" ] && [ -n "${OSS_ACCESS_KEY_SECRET:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Aliyun OSS credentials are not configured; GitHub Release assets remain available for local OSS publishing."
          fi

      - name: Upload delivery package to Aliyun OSS
        if: startsWith(github.ref, 'refs/tags/mac-build-') && steps.oss_credentials.outputs.configured == 'true'
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID || secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET || secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          OSS_SECURITY_TOKEN: ${{ secrets.OSS_SECURITY_TOKEN || secrets.ALIBABA_CLOUD_SECURITY_TOKEN }}
          DMG_PATH: ${{ steps.artifact.outputs.dmg }}
          ZIP_PATH: ${{ steps.artifact.outputs.zip }}
        run: |
          set -euo pipefail
          test -n "${OSS_ACCESS_KEY_ID:-}"
          test -n "${OSS_ACCESS_KEY_SECRET:-}"
          npm install --no-save --no-package-lock --ignore-scripts ali-oss@6
          VERSION=$(node -p "require('./resources/config.json').version")
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            DMG_OBJECT="downloads/QuizMate-Mac-Apple-Silicon-${VERSION}.dmg"
            ZIP_OBJECT="mac/QuizMate-Mac-arm64-${VERSION}.zip"
            LOG_OBJECT="mac/QuizMate-Mac-arm64-${VERSION}-build.log"
          else
            DMG_OBJECT="downloads/QuizMate-Mac-Intel-${VERSION}.dmg"
            ZIP_OBJECT="mac/QuizMate-Mac-x64-${VERSION}.zip"
            LOG_OBJECT="mac/QuizMate-Mac-x64-${VERSION}-build.log"
          fi
          OSS_ACCESS_KEY_ID="$OSS_ACCESS_KEY_ID" OSS_ACCESS_KEY_SECRET="$OSS_ACCESS_KEY_SECRET" \
          OSS_SECURITY_TOKEN="${OSS_SECURITY_TOKEN:-}" VERSION="$VERSION" \
          DMG_OBJECT="$DMG_OBJECT" ZIP_OBJECT="$ZIP_OBJECT" LOG_OBJECT="$LOG_OBJECT" \
          DMG_PATH="$DMG_PATH" ZIP_PATH="$ZIP_PATH" node <<'NODE'
          const OSS = require('ali-oss');
          const fs = require('fs');
          const client = new OSS({
            region: 'cn-beijing',
            endpoint: 'https://oss-cn-beijing.aliyuncs.com',
            bucket: 'quizmate-cn',
            secure: true,
            accessKeyId: process.env.OSS_ACCESS_KEY_ID,
            accessKeySecret: process.env.OSS_ACCESS_KEY_SECRET,
            stsToken: process.env.OSS_SECURITY_TOKEN || undefined,
            timeout: 1200000,
          });
          const uploads = [
            [process.env.DMG_OBJECT, process.env.DMG_PATH, 'application/x-apple-diskimage'],
            [process.env.ZIP_OBJECT, process.env.ZIP_PATH, 'application/zip'],
            [process.env.LOG_OBJECT, 'build.log', 'text/plain; charset=utf-8'],
          ];
          (async () => {
            for (const [object, file, contentType] of uploads) {
              await client.multipartUpload(object, file, {
                parallel: 8,
                partSize: 8 * 1024 * 1024,
                headers: { 'Content-Type': contentType, 'Cache-Control': 'no-cache' },
              });
              const head = await client.head(object);
              const expected = fs.statSync(file).size;
              const actual = Number(head.res.headers['content-length']);
              if (actual !== expected) throw new Error(`size mismatch for ${object}: ${actual} != ${expected}`);
              console.log(`UPLOAD_VERIFY_OK quizmate-cn/${object} size=${actual}`);
            }
          })().catch((error) => { console.error(error.stack || error); process.exit(1); });
          NODE

      - name: Upload diagnostic log fallback
        if: always() && startsWith(github.ref, 'refs/tags/mac-build-')
        shell: bash
        run: |
          set -euo pipefail
          test -f build.log || printf 'Build stopped before the logged steps.\n' > build.log
          echo "Diagnostic log upload is handled with the protected OSS credentials in the delivery step."

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/mac-build-')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: QuizMate-Mac-*-${{ github.run_number }}
          path: release-artifacts

      - name: Normalize release filenames
        id: release_files
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./mac客户端/QuizMate-Mac/resources/config.json').version")
          APPLE_DIR=$(find release-artifacts -maxdepth 1 -type d -name 'QuizMate-Mac-Apple-Silicon-*' -print -quit)
          INTEL_DIR=$(find release-artifacts -maxdepth 1 -type d -name 'QuizMate-Mac-Intel-*' -print -quit)
          test -d "$APPLE_DIR"
          test -d "$INTEL_DIR"
          APPLE_DMG=$(find "$APPLE_DIR" -type f -name '*.dmg' -print -quit)
          APPLE_ZIP=$(find "$APPLE_DIR" -type f -name '*-mac.zip' -print -quit)
          INTEL_DMG=$(find "$INTEL_DIR" -type f -name '*.dmg' -print -quit)
          INTEL_ZIP=$(find "$INTEL_DIR" -type f -name '*-mac.zip' -print -quit)
          test -f "$APPLE_DMG"
          test -f "$APPLE_ZIP"
          test -f "$INTEL_DMG"
          test -f "$INTEL_ZIP"
          mkdir -p github-release
          cp "$APPLE_DMG" "github-release/QuizMate-Mac-Apple-Silicon-${VERSION}.dmg"
          cp "$APPLE_ZIP" "github-release/QuizMate-Mac-arm64-${VERSION}.zip"
          cp "$INTEL_DMG" "github-release/QuizMate-Mac-Intel-${VERSION}.dmg"
          cp "$INTEL_ZIP" "github-release/QuizMate-Mac-x64-${VERSION}.zip"
          test "$(find github-release -maxdepth 1 -type f | wc -l | tr -d ' ')" = "4"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_files.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "QuizMate Mac ${VERSION}" --notes "QuizMate Mac ${VERSION} verified Intel and Apple Silicon builds."
          fi
          gh release upload "$GITHUB_REF_NAME" github-release/* --clobber
          test "$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')" -ge 4
