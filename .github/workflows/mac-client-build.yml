name: Build QuizMate Mac

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mac-client
      - mac-build-fix
    tags:
      - mac-build-*
permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.label }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            label: Intel
            expected: x86_64
            uploadKey: intel
            zipUploadKey: intelZip
            logUploadKey: intelLog
          - arch: arm64
            label: Apple-Silicon
            expected: arm64
            uploadKey: apple
            zipUploadKey: appleZip
            logUploadKey: appleLog

    defaults:
      run:
        working-directory: mac客户端/QuizMate-Mac

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mac客户端/QuizMate-Mac/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Validate source
        shell: bash
        run: |
          set -o pipefail
          {
            npm run typecheck:node
            npm run typecheck:web
            # npm audit depends on the registry advisory endpoint. Keep the
            # report, but do not block an otherwise valid package build when
            # that external service is unavailable.
            npm audit --audit-level=high || {
              status=$?
              echo "::warning::npm audit did not complete (exit ${status}); see build.log"
            }
          } 2>&1 | tee -a build.log

      - name: Build DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          {
            npm run build
            npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
          } 2>&1 | tee -a build.log

      - name: Re-sign app for local distribution
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          APP_PATH=$(find release -maxdepth 2 -name 'QuizMate.app' -type d -print -quit)
          test -d "$APP_PATH"
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          rm -f release/QuizMate-Mac-${{ matrix.arch }}-*.dmg
          rm -f release/QuizMate-*-${{ matrix.arch }}-mac.zip
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --prepackaged "$APP_PATH" --publish never

      - name: Verify DMG and executable architecture
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          DMG=$(find release -maxdepth 1 -name "*.dmg" -print -quit)
          ZIP=$(find release -maxdepth 1 -name "*-mac.zip" -print -quit)
          test -n "$DMG"
          test -n "$ZIP"
          hdiutil verify "$DMG"
          MOUNT_DIR=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT_DIR" -nobrowse -readonly
          APP_BIN=$(find "$MOUNT_DIR" -path "*/Contents/MacOS/QuizMate" -type f -print -quit)
          test -n "$APP_BIN"
          APP_PATH=$(find "$MOUNT_DIR" -maxdepth 1 -name 'QuizMate.app' -type d -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee codesign.txt
          file "$APP_BIN" | tee architecture.txt
          grep -q "${{ matrix.expected }}" architecture.txt
          hdiutil detach "$MOUNT_DIR"
          shasum -a 256 "$DMG" | tee sha256.txt
          shasum -a 256 "$ZIP" | tee -a sha256.txt
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease with Mac package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            mac-build-*) ;;
            *) TAG="mac-build-manual-${{ github.run_number }}" ;;
          esac
          RELEASE_TITLE="QuizMate Mac ${TAG}"
          RELEASE_NOTES="Mac 测试安装包：Intel 与 Apple Silicon 分别构建、分别下载。DMG 用于手动安装测试，ZIP 用于更新链路验证。SHA-256 见对应 sha256 文件。"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" || gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          fi
          cp sha256.txt "sha256-${{ matrix.arch }}.txt"
          cp architecture.txt "architecture-${{ matrix.arch }}.txt"
          cp codesign.txt "codesign-${{ matrix.arch }}.txt"
          cp build.log "build-${{ matrix.arch }}.log"
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ steps.artifact.outputs.dmg }}" \
            "${{ steps.artifact.outputs.zip }}" \
            "sha256-${{ matrix.arch }}.txt" \
            "architecture-${{ matrix.arch }}.txt" \
            "codesign-${{ matrix.arch }}.txt" \
            "build-${{ matrix.arch }}.log"
          gh release view "$TAG" --repo "${{ github.repository }}" --json url -q '.url'

      - name: Upload Actions artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: QuizMate-Mac-${{ matrix.label }}-${{ github.run_number }}
          path: |
            mac客户端/QuizMate-Mac/${{ steps.artifact.outputs.dmg }}
            mac客户端/QuizMate-Mac/${{ steps.artifact.outputs.zip }}
            mac客户端/QuizMate-Mac/architecture.txt
            mac客户端/QuizMate-Mac/codesign.txt
            mac客户端/QuizMate-Mac/sha256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload delivery package
        if: startsWith(github.ref, 'refs/tags/mac-delivery-')
        shell: bash
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          UPLOAD_KEY: ${{ matrix.uploadKey }}
          ZIP_UPLOAD_KEY: ${{ matrix.zipUploadKey }}
          DMG_PATH: ${{ steps.artifact.outputs.dmg }}
          ZIP_PATH: ${{ steps.artifact.outputs.zip }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          TAG_PAYLOAD_B64=$(git cat-file tag "$GITHUB_REF_NAME" | sed '1,/^$/d' | tr -d '\n')
          UPLOAD_URL=$(TAG_PAYLOAD_B64="$TAG_PAYLOAD_B64" node -e "const p=JSON.parse(Buffer.from(process.env.TAG_PAYLOAD_B64, 'base64').toString('utf8')); process.stdout.write(p[process.env.UPLOAD_KEY])")
          ZIP_UPLOAD_URL=$(TAG_PAYLOAD_B64="$TAG_PAYLOAD_B64" node -e "const p=JSON.parse(Buffer.from(process.env.TAG_PAYLOAD_B64, 'base64').toString('utf8')); process.stdout.write(p[process.env.ZIP_UPLOAD_KEY])")
          test -n "$UPLOAD_URL"
          test -n "$ZIP_UPLOAD_URL"
          echo "::add-mask::$UPLOAD_URL"
          echo "::add-mask::$ZIP_UPLOAD_URL"
          curl --fail --silent --show-error --retry 3 \
            -X PUT \
            -H "Content-Type: application/x-apple-diskimage" \
            --upload-file "$DMG_PATH" \
            "$UPLOAD_URL"
          curl --fail --silent --show-error --retry 3 \
            -X PUT \
            -H "Content-Type: application/zip" \
            --upload-file "$ZIP_PATH" \
            "$ZIP_UPLOAD_URL"

      - name: Upload diagnostic log
        if: always() && startsWith(github.ref, 'refs/tags/mac-delivery-')
        shell: bash
        env:
          LOG_UPLOAD_KEY: ${{ matrix.logUploadKey }}
        run: |
          set -euo pipefail
          test -f build.log || printf 'Build stopped before the logged steps.\n' > build.log
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          TAG_PAYLOAD_B64=$(git cat-file tag "$GITHUB_REF_NAME" | sed '1,/^$/d' | tr -d '\n')
          UPLOAD_URL=$(TAG_PAYLOAD_B64="$TAG_PAYLOAD_B64" node -e "const p=JSON.parse(Buffer.from(process.env.TAG_PAYLOAD_B64, 'base64').toString('utf8')); process.stdout.write(p[process.env.LOG_UPLOAD_KEY])")
          test -n "$UPLOAD_URL"
          echo "::add-mask::$UPLOAD_URL"
          curl --fail --silent --show-error --retry 3 \
            -X PUT \
            -H "Content-Type: text/plain; charset=utf-8" \
            --upload-file build.log \
            "$UPLOAD_URL"
