name: Build QuizMate Mac

# Mac 安装包统一在 GitHub Actions 构建（本地只保留代码）。
# 实际源码在 desktop-core，本工作目录只承担构建配置：
#   mac客户端/QuizMate-Mac/package.json 与 electron-builder.yml
# Apple Silicon 与 Intel 分别构建、分别上传产物。
on:
  workflow_dispatch:
  push:
    branches:
      - feature/desktop-unified-core
      - main
      - mac-build-*
    tags:
      - mac-build-*
      - mac-delivery-*
      - mac-release-*
permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.label }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            label: Intel
            expected: x86_64
            uploadKey: intel
            zipUploadKey: intelZip
            logUploadKey: intelLog
          - arch: arm64
            label: Apple-Silicon
            expected: arm64
            uploadKey: apple
            zipUploadKey: appleZip
            logUploadKey: appleLog

    defaults:
      run:
        working-directory: mac客户端/QuizMate-Mac

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mac客户端/QuizMate-Mac/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Verify desktop-core dependency bridge
        # postinstall 会通过 scripts/link-core-modules.cjs 在 desktop-core 下创建
        # 指向本壳 node_modules 的符号链接，vite/tsc 才能解析共享层源码的依赖。
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          test -d ../../desktop-core/node_modules/electron \
            || { echo "::error::desktop-core/node_modules bridge missing; link-core-modules.cjs failed"; exit 1; }
          echo "desktop-core dependency bridge OK"

      - name: Validate source
        shell: bash
        run: |
          set -o pipefail
          {
            npm run typecheck:node
            npm run typecheck:web
            npm run test:shared
            npm run test:mac-protection
            # npm audit depends on the registry advisory endpoint. Keep the
            # report, but do not block an otherwise valid package build when
            # that external service is unavailable.
            npm audit --audit-level=high || {
              status=$?
              echo "::warning::npm audit did not complete (exit ${status}); see build.log"
            }
          } 2>&1 | tee -a build.log

      - name: Configure signing and notarization gate
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/mac-release-* ]]; then
            # mac-build/mac-delivery are isolated test packages. Keep them
            # reproducibly ad-hoc even when repository secrets contain an
            # unusable placeholder; only mac-release may consume Developer ID.
            echo "MAC_SIGNED_BUILD=false" >> "$GITHUB_ENV"
            echo "MAC_NOTARIZE=false" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning::Building an ad-hoc Mac test package; Gatekeeper, stable TCC identity and automatic update eligibility are not claimed"
            exit 0
          fi

          test -n "${MAC_CSC_LINK:-}" || { echo "::error::MAC_CSC_LINK is required for a production Mac release"; exit 1; }
          test -n "${MAC_CSC_KEY_PASSWORD:-}" || { echo "::error::MAC_CSC_KEY_PASSWORD is required for a production Mac release"; exit 1; }
          test -n "${APPLE_ID:-}" || { echo "::error::APPLE_ID is required for notarization"; exit 1; }
          test -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" || { echo "::error::APPLE_APP_SPECIFIC_PASSWORD is required for notarization"; exit 1; }
          test -n "${APPLE_TEAM_ID:-}" || { echo "::error::APPLE_TEAM_ID is required for notarization"; exit 1; }

          CERT_PATH="$RUNNER_TEMP/quizmate-developer-id.p12"
          case "$MAC_CSC_LINK" in
            https://*|http://*)
              printf 'CSC_LINK=%s\n' "$MAC_CSC_LINK" >> "$GITHUB_ENV"
              ;;
            file://*)
              LOCAL_CERT_PATH="${MAC_CSC_LINK#file://}"
              test -f "$LOCAL_CERT_PATH" || {
                echo "::error::MAC_CSC_LINK file URL does not exist on the GitHub runner; store the .p12 file as Base64 instead"
                exit 1
              }
              printf 'CSC_LINK=%s\n' "$MAC_CSC_LINK" >> "$GITHUB_ENV"
              ;;
            /*)
              test -f "$MAC_CSC_LINK" || {
                echo "::error::MAC_CSC_LINK path does not exist on the GitHub runner; store the .p12 file as Base64 instead"
                exit 1
              }
              printf 'CSC_LINK=file://%s\n' "$MAC_CSC_LINK" >> "$GITHUB_ENV"
              ;;
            *)
              CERT_BASE64="$MAC_CSC_LINK"
              CERT_BASE64="${CERT_BASE64#base64:}"
              CERT_BASE64="${CERT_BASE64#data:application/x-pkcs12;base64,}"
              if ! printf '%s' "$CERT_BASE64" \
                | tr -d '[:space:]' \
                | openssl base64 -d -A -out "$CERT_PATH"; then
                echo "::error::MAC_CSC_LINK is neither a runner file/URL nor valid Base64"
                exit 1
              fi
              test -s "$CERT_PATH" || { echo "::error::Decoded MAC_CSC_LINK is empty"; exit 1; }
              if ! openssl pkcs12 -in "$CERT_PATH" -passin env:MAC_CSC_KEY_PASSWORD -noout >/dev/null 2>&1; then
                echo "::error::Decoded MAC_CSC_LINK is not a valid PKCS#12 file or MAC_CSC_KEY_PASSWORD is incorrect"
                exit 1
              fi
              chmod 600 "$CERT_PATH"
              printf 'CSC_LINK=file://%s\n' "$CERT_PATH" >> "$GITHUB_ENV"
              ;;
          esac
          printf 'CSC_KEY_PASSWORD=%s\n' "$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          echo "MAC_SIGNED_BUILD=true" >> "$GITHUB_ENV"
          echo "MAC_NOTARIZE=true" >> "$GITHUB_ENV"

      - name: Build DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # delivery 测试包使用独立空更新通道，不读取正式 mac/latest-mac.yml。
          QUIZMATE_UPDATE_BASE_URL: ${{ startsWith(github.ref, 'refs/tags/mac-delivery-') && format('https://quizmate.cn/temp/{0}', github.ref_name) || 'https://quizmate.cn' }}
        run: |
          set -o pipefail
          {
            npm run build
            npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never
          } 2>&1 | tee -a build.log

      - name: Re-sign app for local distribution
        if: env.MAC_SIGNED_BUILD != 'true'
        shell: bash
        env:
          QUIZMATE_UPDATE_BASE_URL: ${{ startsWith(github.ref, 'refs/tags/mac-delivery-') && format('https://quizmate.cn/temp/{0}', github.ref_name) || 'https://quizmate.cn' }}
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          APP_PATH=$(find release -maxdepth 2 -name 'QuizMate.app' -type d -print -quit)
          test -d "$APP_PATH"
          codesign --force --deep --options runtime --entitlements resources/entitlements.mac.plist --sign - --timestamp=none "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          rm -f release/QuizMate-Mac-${{ matrix.arch }}-*.dmg
          rm -f release/QuizMate-*-${{ matrix.arch }}-mac.zip
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --prepackaged "$APP_PATH" --publish never

      - name: Verify DMG and executable architecture
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a build.log) 2>&1
          DMG=$(find release -maxdepth 1 -name "*.dmg" -print -quit)
          ZIP=$(find release -maxdepth 1 -name "*-mac.zip" -print -quit)
          test -n "$DMG"
          test -n "$ZIP"
          hdiutil verify "$DMG"
          MOUNT_DIR=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT_DIR" -nobrowse -readonly
          APP_BIN=$(find "$MOUNT_DIR" -path "*/Contents/MacOS/QuizMate" -type f -print -quit)
          test -n "$APP_BIN"
          APP_PATH=$(find "$MOUNT_DIR" -maxdepth 1 -name 'QuizMate.app' -type d -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee codesign.txt
          if [[ "${MAC_SIGNED_BUILD:-false}" == "true" ]]; then
            TEAM_ID=$(codesign -dv --verbose=4 "$APP_PATH" 2>&1 | sed -n 's/^TeamIdentifier=//p')
            test -n "$TEAM_ID"
            test "$TEAM_ID" != "not set"
            spctl --assess --type execute --verbose=4 "$APP_PATH"
            if [[ "${MAC_NOTARIZE:-false}" == "true" ]]; then
              xcrun stapler validate "$APP_PATH"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/mac-release-* ]]; then
            echo "::error::Production release cannot use ad-hoc signing"
            exit 1
          fi
          file "$APP_BIN" | tee architecture.txt
          grep -q "${{ matrix.expected }}" architecture.txt
          hdiutil detach "$MOUNT_DIR"
          shasum -a 256 "$DMG" | tee sha256.txt
          shasum -a 256 "$ZIP" | tee -a sha256.txt
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub prerelease with Mac package
        # Some repositories enforce a read-only GITHUB_TOKEN regardless of the
        # workflow-level contents permission. Preserve the verified package as
        # an Actions artifact and let an authenticated maintainer upload it.
        continue-on-error: true
        env:
          # Optional maintainer token is used only when repository policy makes
          # the built-in GITHUB_TOKEN read-only. The package still remains in
          # Actions Artifact when this secret is absent.
          GH_TOKEN: ${{ secrets.MAC_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            mac-build-*) ;;
            *) TAG="mac-build-manual-${{ github.run_number }}" ;;
          esac
          RELEASE_TITLE="QuizMate Mac ${TAG}"
          RELEASE_NOTES="Mac 测试安装包：Intel 与 Apple Silicon 分别构建、分别下载。DMG 用于手动安装测试，ZIP 用于更新链路验证。SHA-256 见对应 sha256 文件。"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" || gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          fi
          cp sha256.txt "sha256-${{ matrix.arch }}.txt"
          cp architecture.txt "architecture-${{ matrix.arch }}.txt"
          cp codesign.txt "codesign-${{ matrix.arch }}.txt"
          cp build.log "build-${{ matrix.arch }}.log"
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            --clobber \
            "${{ steps.artifact.outputs.dmg }}" \
            "${{ steps.artifact.outputs.zip }}" \
            "sha256-${{ matrix.arch }}.txt" \
            "architecture-${{ matrix.arch }}.txt" \
            "codesign-${{ matrix.arch }}.txt" \
            "build-${{ matrix.arch }}.log"
          gh release view "$TAG" --repo "${{ github.repository }}" --json url -q '.url'

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizMate-Mac-${{ matrix.label }}-${{ github.run_number }}
          path: |
            mac客户端/QuizMate-Mac/${{ steps.artifact.outputs.dmg }}
            mac客户端/QuizMate-Mac/${{ steps.artifact.outputs.zip }}
            mac客户端/QuizMate-Mac/architecture.txt
            mac客户端/QuizMate-Mac/codesign.txt
            mac客户端/QuizMate-Mac/sha256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload delivery package
        if: startsWith(github.ref, 'refs/tags/mac-delivery-')
        shell: bash
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          UPLOAD_KEY: ${{ matrix.uploadKey }}
          ZIP_UPLOAD_KEY: ${{ matrix.zipUploadKey }}
          DMG_PATH: ${{ steps.artifact.outputs.dmg }}
          ZIP_PATH: ${{ steps.artifact.outputs.zip }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          TAG_PAYLOAD_B64=$(git cat-file tag "$GITHUB_REF_NAME" | sed '1,/^$/d' | tr -d '\n')
          UPLOAD_URL=$(TAG_PAYLOAD_B64="$TAG_PAYLOAD_B64" node -e "const p=JSON.parse(Buffer.from(process.env.TAG_PAYLOAD_B64, 'base64').toString('utf8')); process.stdout.write(p[process.env.UPLOAD_KEY])")
          ZIP_UPLOAD_URL=$(TAG_PAYLOAD_B64="$TAG_PAYLOAD_B64" node -e "const p=JSON.parse(Buffer.from(process.env.TAG_PAYLOAD_B64, 'base64').toString('utf8')); process.stdout.write(p[process.env.ZIP_UPLOAD_KEY])")
          test -n "$UPLOAD_URL"
          test -n "$ZIP_UPLOAD_URL"
          echo "::add-mask::$UPLOAD_URL"
          echo "::add-mask::$ZIP_UPLOAD_URL"
          curl --fail --silent --show-error --retry 3 \
            -X PUT \
            -H "Content-Type: application/x-apple-diskimage" \
            --upload-file "$DMG_PATH" \
            "$UPLOAD_URL"
          curl --fail --silent --show-error --retry 3 \
            -X PUT \
            -H "Content-Type: application/zip" \
            --upload-file "$ZIP_PATH" \
            "$ZIP_UPLOAD_URL"

      - name: Upload diagnostic log
        if: always() && startsWith(github.ref, 'refs/tags/mac-delivery-')
        shell: bash
        env:
          LOG_UPLOAD_KEY: ${{ matrix.logUploadKey }}
        run: |
          set -euo pipefail
          test -f build.log || printf 'Build stopped before the logged steps.\n' > build.log
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          TAG_PAYLOAD_B64=$(git cat-file tag "$GITHUB_REF_NAME" | sed '1,/^$/d' | tr -d '\n')
          UPLOAD_URL=$(TAG_PAYLOAD_B64="$TAG_PAYLOAD_B64" node -e "const p=JSON.parse(Buffer.from(process.env.TAG_PAYLOAD_B64, 'base64').toString('utf8')); process.stdout.write(p[process.env.LOG_UPLOAD_KEY])")
          test -n "$UPLOAD_URL"
          echo "::add-mask::$UPLOAD_URL"
          curl --fail --silent --show-error --retry 3 \
            -X PUT \
            -H "Content-Type: text/plain; charset=utf-8" \
            --upload-file build.log \
            "$UPLOAD_URL"
