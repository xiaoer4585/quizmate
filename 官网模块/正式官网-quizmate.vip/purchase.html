    <script>
      (() => {
        const form = document.querySelector("[data-site-chat-form]");
        const box = document.querySelector("[data-site-chat-box]");
        if (!form || !box) return;

        const endpoint = "https://kefu.quizmate.vip/api/chat";
        const sessionId = `website-${Date.now()}-${Math.random().toString(16).slice(2)}`;

        function appendMessage(role, text) {
          const message = document.createElement("div");
          message.className = `chat-msg ${role}`;
          message.textContent = text;
          box.appendChild(message);
          box.scrollTop = box.scrollHeight;
          return message;
        }

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          const input = form.elements.message;
          const content = input.value.trim();
          if (!content) return;
          input.value = "";
          appendMessage("user", content);
          const pending = appendMessage("assistant", "正在回复...");
          try {
            const response = await fetch(endpoint, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                platform: "website",
                user_id: sessionId,
                content,
              }),
            });
            const data = await response.json();
            pending.textContent = data.success && data.response
              ? data.response
              : "在线客服暂时未返回结果，请扫码添加企业微信人工咨询。";
          } catch (error) {
            pending.textContent = "在线客服连接失败，请扫码添加企业微信人工咨询。";
          }
        });
      })();
    </script>

    <script>
    (function () {
      function init() {
        var toggle = document.getElementById("floatContactToggle");
        var closeBtn = document.getElementById("floatContactClose");
        var fc = document.getElementById("floatContact");
        var panel = document.getElementById("floatContactPanel");
        if (!toggle || !fc) return;
        function open() { fc.classList.add("is-open"); toggle.setAttribute("aria-expanded", "true"); }
        function close() { fc.classList.remove("is-open"); toggle.setAttribute("aria-expanded", "false"); }
        toggle.addEventListener("click", function (e) { e.stopPropagation(); fc.classList.contains("is-open") ? close() : open(); });
        if (closeBtn) closeBtn.addEventListener("click", function (e) { e.stopPropagation(); close(); });
        document.addEventListener("click", function () { close(); });
        if (panel) panel.addEventListener("click", function (e) { e.stopPropagation(); });
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
    </script>
